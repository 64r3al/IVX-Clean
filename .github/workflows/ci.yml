name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Check docs/RULES.md is up to date
        run: |
          dotnet run --project tools/RulesDocGen -c Release --no-build -- docs/RULES.md
          git diff --exit-code -- docs/RULES.md

      - name: Test (with coverage)
        run: >
          dotnet test -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults
          if-no-files-found: ignore

      - name: Publish app (smoke)
        run: dotnet publish src/IvxClean.App/IvxClean.App.csproj -c Release -r win-x64 --no-self-contained -o ${{ github.workspace }}/publish

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ivxclean-app-win-x64
          path: ${{ github.workspace }}/publish
          if-no-files-found: error
